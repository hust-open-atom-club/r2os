BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "r2os"
BBFILE_PATTERN_r2os := "^${LAYERDIR}/"
BBFILE_PRIORITY_r2os = "7"

# Wrynose defines UNPACKDIR globally; provide a compatible default for older
# Yocto releases where unpacked files live directly under WORKDIR.
UNPACKDIR ?= "${WORKDIR}"

# The distro layer needs the K230 BSP for the machine configuration and the
# application recipes for packagegroup-k230-common and the development
# packagegroup.
LAYERDEPENDS_r2os = "core k230 r2os-apps"
LAYERSERIES_COMPAT_r2os = "scarthgap wrynose"
