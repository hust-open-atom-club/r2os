BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "r2os"
BBFILE_PATTERN_r2os := "^${LAYERDIR}/"
BBFILE_PRIORITY_r2os = "7"

# Do not set UNPACKDIR here.  Wrynose defines it as ${WORKDIR}/sources and
# rejects ${WORKDIR} for any recipe, including oe-core's own.  Scarthgap has no
# UNPACKDIR at all, so the legacy default belongs to the scarthgap host flow in
# scripts/yocto-host-build instead of this layer.

# The distro layer needs the K230 BSP for the machine configuration and the
# application recipes for packagegroup-k230-common and the development
# packagegroup.
LAYERDEPENDS_r2os = "core k230 r2os-apps"
LAYERSERIES_COMPAT_r2os = "scarthgap wrynose"
