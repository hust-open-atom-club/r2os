BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "r2os-apps"
BBFILE_PATTERN_r2os-apps := "^${LAYERDIR}/"
BBFILE_PRIORITY_r2os-apps = "6"

# Wrynose defines UNPACKDIR globally; provide a compatible default for older
# Yocto releases where unpacked files live directly under WORKDIR.
UNPACKDIR ?= "${WORKDIR}"

LAYERDEPENDS_r2os-apps = "core"
LAYERSERIES_COMPAT_r2os-apps = "scarthgap wrynose"
