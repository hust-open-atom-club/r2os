BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "r2os-apps"
BBFILE_PATTERN_r2os-apps := "^${LAYERDIR}/"
BBFILE_PRIORITY_r2os-apps = "6"

# Wrynose defines UNPACKDIR (${WORKDIR}/sources) and insane.bbclass rejects
# ${WORKDIR} as an error, so only releases that do not define UNPACKDIR at all
# get the legacy default.  A plain "UNPACKDIR ?= ${WORKDIR}" would be picked up
# by Wrynose builds and fail every recipe.
python __anonymous() {
    if not d.getVar("UNPACKDIR"):
        d.setVar("UNPACKDIR", "${WORKDIR}")
}

LAYERDEPENDS_r2os-apps = "core"
LAYERSERIES_COMPAT_r2os-apps = "scarthgap wrynose"
