BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "k230"
BBFILE_PATTERN_k230 := "^${LAYERDIR}/"
BBFILE_PRIORITY_k230 = "6"

K230BASE := "${LAYERDIR}"
WKS_SEARCH_PATH:append = ":${K230BASE}/wic"

# Do not set UNPACKDIR here.  Wrynose defines it as ${WORKDIR}/sources and
# rejects ${WORKDIR} for any recipe, including oe-core's own.  Scarthgap has no
# UNPACKDIR at all, so the legacy default belongs to the scarthgap host flow in
# scripts/yocto-host-build instead of this layer.

# The original Phase-1 scarthgap plan referenced:
# LAYERDEPENDS_k230 = "riscv-layer"
# The local Wrynose setup already carries the RISC-V tune files in OE-core, so
# keep the active dependency parseable in the current build environment.
LAYERDEPENDS_k230 = "core"
LAYERRECOMMENDS_k230 = "riscv-layer"
LAYERSERIES_COMPAT_k230 = "scarthgap wrynose"
