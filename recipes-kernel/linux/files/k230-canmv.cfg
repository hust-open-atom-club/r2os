# SPDX-License-Identifier: MIT

# Canaan K230 SoC selection.
CONFIG_ARCH_CANAAN=y
CONFIG_NONPORTABLE=y

# K230 QEMU serial console: DW APB 8250 at 0x91400000.
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_8250_DW=y
CONFIG_SERIAL_OF_PLATFORM=y

# Initramfs and block/rootfs basics.
CONFIG_BLK_DEV_INITRD=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_TMPFS=y
CONFIG_EXT4_FS=y
CONFIG_FAT_FS=y
CONFIG_VFAT_FS=y
CONFIG_MSDOS_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y

# QEMU and low-level storage support.
CONFIG_VIRTIO_MMIO=y
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y
CONFIG_MMC_SDHCI_OF_DWCMSHC=y

# QEMU SiFive test finisher poweroff/reboot support.
CONFIG_POWER_RESET=y
CONFIG_POWER_RESET_SYSCON=y
CONFIG_POWER_RESET_SYSCON_POWEROFF=y
CONFIG_MFD_SYSCON=y
CONFIG_REGMAP_MMIO=y

# USB host and the QEMU k230 default usb-rtl8152 NIC.
CONFIG_USB_SUPPORT=y
CONFIG_USB=y
CONFIG_USB_DWC2=y
CONFIG_USB_DWC2_HOST=y
CONFIG_USB_USBNET=y
CONFIG_USB_RTL8152=y

# K230 basic peripheral drivers with matching DTS compatible strings.
CONFIG_PINCTRL=y
CONFIG_PINCTRL_K230=y
CONFIG_RESET_CONTROLLER=y
CONFIG_RESET_K230=y
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_DESIGNWARE_CORE=y
CONFIG_I2C_DESIGNWARE_PLATFORM=y
CONFIG_SPI=y
CONFIG_SPI_DESIGNWARE=y
CONFIG_SPI_DW_MMIO=y
CONFIG_WATCHDOG=y
CONFIG_DW_WATCHDOG=y

# Networking needed for SSH, DHCP, and user-mode QEMU networking.
CONFIG_NET=y
CONFIG_PACKET=y
CONFIG_UNIX=y
CONFIG_INET=y
CONFIG_IP_PNP=y
CONFIG_IP_PNP_DHCP=y
CONFIG_SYN_COOKIES=y

# ============================================================================
# Embedded system optimizations
# ============================================================================

# Build kernel with -Os.  Reduces image size by ~15-20%, important for the
# 64 MB /boot partition.  Performance difference is negligible on C908.
CONFIG_CC_OPTIMIZE_FOR_SIZE=y

# Tickless idle: stop the timer tick when the CPU is idle, reducing wake-ups
# and saving power on a single-core system.
CONFIG_NO_HZ_IDLE=y

# Voluntary preemption adds explicit preemption points for better interactive
# responsiveness than PREEMPT_NONE without the instability risks of PREEMPT.
CONFIG_PREEMPT_VOLUNTARY=y

# Memory compaction helps satisfy higher-order allocations on long-running
# systems by moving pages to create contiguous blocks.
CONFIG_COMPACTION=y

# Kernel Same-page Merging scans for identical pages and merges them.  Saves
# ~50-200 MB on a 2 GB system where multiple processes share libc pages.
CONFIG_KSM=y

# ============================================================================
# Advanced filesystem support for embedded rootfs patterns
# ============================================================================

# OverlayFS enables read-only lower + writable tmpfs upper for "factory-reset"
# embedded systems where runtime changes are discarded on reboot.
CONFIG_OVERLAY_FS=y

# SquashFS with XZ compression for the smallest possible read-only rootfs.
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y

# ============================================================================
# Lightweight cgroup resource management
# ============================================================================

# Basic cgroup infrastructure with minimal overhead.  Enables per-process
# resource limits on BusyBox-init systems.
CONFIG_CGROUPS=y

# Memory cgroup allows per-process memory limits on a 2 GB system.
CONFIG_MEMCG=y

# Block I/O cgroup allows per-process I/O throttling to protect the SD card.
CONFIG_BLK_CGROUP=y

# ============================================================================
# Kernel hardening
# ============================================================================

# Mark kernel .text and .rodata read-only at the page-table level.
CONFIG_STRICT_KERNEL_RWX=y

# Strong stack protector inserts a canary on every function's stack frame.
CONFIG_STACKPROTECTOR_STRONG=y

# FORTIFY_SOURCE replaces memcpy/memset/strcpy with fortified wrappers.
CONFIG_FORTIFY_SOURCE=y

# HARDENED_USERCOPY validates usercopy operations stay within object boundaries.
CONFIG_HARDENED_USERCOPY=y

# ============================================================================
# Explicitly disabled (reduce kernel size and attack surface)
# ============================================================================

# No swap on SD-card-backed embedded: swapping causes latency spikes and flash
# wear.  The OOM killer fires instead, which is the intended behavior.
# CONFIG_SWAP is not set

# No multi-core scheduler domains on a single-core C908 system.
# CONFIG_SCHED_MC is not set

# No core dumps on production embedded systems.  Note: CONFIG_ELF_CORE
# selects this, so it stays on; core dumps are still controlled at runtime
# with ulimit -c (defaults to 0, no dumps).
# CONFIG_COREDUMP is not set
